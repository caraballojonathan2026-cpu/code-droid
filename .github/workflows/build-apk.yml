# Builds the hello-droid APK with code-droid's own direct pipeline
# (aapt2 -> kotlinc -> d8 -> zipalign -> apksigner, no Gradle) and
# uploads app-debug.apk as a downloadable artifact.
name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'projects/**'
      - 'templates/**'
      - 'server/**'
      - 'tools/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install toolchain (~300MB, from Google/JetBrains)
        run: bash tools/install.sh

      - name: Build APK (code-droid direct pipeline)
        run: node tools/ci-build.js

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: projects/hello-droid/build/app-debug.apk
          if-no-files-found: error
